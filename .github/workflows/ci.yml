name: Vibe Finance CI/CD Pipeline

on:
  push:
    branches: [ main, debugging, debugging-and-error-correction, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Code Quality & Syntax Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all formatting errors as warnings
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Dependency Security Audit (Python pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc on || true

      - name: Execute End-to-End Test Suite (All 21 Scenarios)
        env:
          PYTHONPATH: .
        run: |
          python -u backend/test_suite.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency Security Audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Build React + Vite Production Bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Container Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vibe-finance:latest
